<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECN Face Recognition System</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
padding:10px;
}
video,canvas{
border:2px solid black;
border-radius:10px;
margin-top:10px;
}
button,input{
padding:10px;
margin:5px;
font-size:16px;
}
</style>
</head>

<body>

<h2>ECN Face Recognition System</h2>

<input id="employeeId" placeholder="Enter Employee ID"><br>
<button id="startBtn" disabled>Start Camera</button>

<p id="faceStatus">Loading models...</p>
<p id="sheetStatus"></p>

<video id="video" width="320" height="240" autoplay muted></video>
<canvas id="overlay" width="320" height="240"></canvas>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");
const startBtn=document.getElementById("startBtn");
const faceStatus=document.getElementById("faceStatus");
const sheetStatus=document.getElementById("sheetStatus");

let faceMatcher;
let labeledDescriptors=[];
let detectionLoop=null;
let sent=false;

/* LOAD MODELS */
async function loadModels(){
await Promise.all([
faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/'),
faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/'),
faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/')
]);
faceStatus.textContent="Models loaded. Enter ID.";
startBtn.disabled=false;
}
window.onload=loadModels;


/* LOAD AUTHORIZED FACES */
async function loadAuthorizedFaces(){

const names=["John Doe","Jane Smith","Ikata Kenoye"];

for(const name of names){

const img=await faceapi.fetchImage(
`https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/${name}.jpg`
);

const det=await faceapi.detectSingleFace(img,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptor();

if(det){
labeledDescriptors.push(
new faceapi.LabeledFaceDescriptors(name,[det.descriptor])
);
}
}

faceMatcher=new faceapi.FaceMatcher(labeledDescriptors,0.6);
}


/* SEND TO GOOGLE SHEET */
async function sendAttendance(employeeId,status,image){

const url="https://script.google.com/macros/s/AKfycbwAjXEdzCUs4E-c31jVfgX8-83YPvzMV4omQwYT18mzorRzVz5S2L2xiJj1UT6WLWq7-A/exec";

try{

await fetch(url,{
method:"POST",
mode:"no-cors",
headers:{ "Content-Type":"application/json"},
body:JSON.stringify({employeeId,status,image})
});

sheetStatus.style.color="green";
sheetStatus.textContent="Attendance Sent";

}catch(err){
sheetStatus.style.color="red";
sheetStatus.textContent="Network Error";
}
}


/* START CAMERA */
startBtn.onclick=async()=>{

const employeeId=document.getElementById("employeeId").value.trim();
if(!employeeId) return alert("Enter ID");

startBtn.disabled=true;
await loadAuthorizedFaces();

const stream=await navigator.mediaDevices.getUserMedia({video:true});
video.srcObject=stream;
await video.play();

faceStatus.textContent="Camera running...";

/* DETECTION LOOP */
detectionLoop=setInterval(async()=>{

if(sent) return;

const detections=await faceapi.detectAllFaces(video,new faceapi.TinyFaceDetectorOptions())
.withFaceLandmarks()
.withFaceDescriptors();

ctx.clearRect(0,0,canvas.width,canvas.height);

const resized=faceapi.resizeResults(detections,{width:video.width,height:video.height});

for(let i=0;i<resized.length;i++){

const result=faceMatcher.findBestMatch(resized[i].descriptor);
const label=result.label==="unknown"?"Unauthorized":"Authorized";

new faceapi.draw.DrawBox(resized[i].detection.box,{label}).draw(canvas);

if(!sent){

sent=true;

const cap=document.createElement("canvas");
cap.width=video.videoWidth;
cap.height=video.videoHeight;
cap.getContext("2d").drawImage(video,0,0);

const img=cap.toDataURL("image/jpeg");

await sendAttendance(employeeId,label,img);

/* STOP CAMERA + LOOP */
clearInterval(detectionLoop);
video.srcObject.getTracks().forEach(t=>t.stop());

faceStatus.textContent="Done. Camera stopped.";
}
}

},1500);
};
</script>
</body>
</html>
