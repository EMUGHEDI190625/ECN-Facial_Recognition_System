!DOCTYPE html> 
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECN Face Recognition System</title>

  <!-- Load face-api.js -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 10px;
      background: #f4f4f4;
    }
    video, canvas {
      border: 2px solid #000;
      border-radius: 8px;
      margin-top: 10px;
    }
    button {
      margin: 5px;
      padding: 8px;
      font-size: 16px;
    }
    #faceStatus {
      margin-top: 10px;
      font-weight: bold;
      color: green;
    }
    #sheetStatus {
      margin-top: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>ECN Face Recognition System</h2>
  <img src="https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/ECN_logo.jpg" alt="ECN Logo"><br>

  <button id="startBtn" disabled>Start Camera</button>
  <p id="faceStatus">Loading models...</p>
  <p id="sheetStatus"></p>

  <video id="video" width="320" height="240" autoplay muted></video>
  <canvas id="overlay" width="320" height="240"></canvas>

<script>
const faceStatusEl = document.getElementById("faceStatus");
const sheetStatusEl = document.getElementById("sheetStatus");
const startBtn = document.getElementById("startBtn");
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

let labeledDescriptors = [];
let faceMatcher;
let recognizedToday = {}; // Track daily recognition per employee
let employeeData = {};    // Store latest employee info

// ----------------------
// Load face-api models
async function loadModels() {
  faceStatusEl.textContent = "⏳ Loading models...";
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/'),
    faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/'),
    faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/')
  ]);
  faceStatusEl.textContent = "✅ Models loaded. Fetching latest Form data...";
  await fetchFormData();
  startBtn.disabled = false;
}

// ----------------------
// Fetch latest Google Form submission
async function fetchFormData() {
  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbzKWapgH7jsuIRVUrWZhR7pkh1Cs_HOrD3CUdS5JJ3i7fAx6HhnQbvwZi12tRj9Ok3aUQ/exec");
    const data = await response.json();

    if (!data || !data.length) throw new Error("No data returned");
    const latest = [...data].reverse().find(row => {
    const keys = Object.keys(row).map(k=>k.toLowerCase());

    const nameKey = keys.find(k=>k.includes("name"));
    const idKey = keys.find(k=>k.includes("id"));

    return nameKey && idKey && row[nameKey] && row[idKey];
    });
    // ---------- SUPER NORMALIZER ----------
    const normalize = str =>
      String(str)
        .normalize("NFD")                  // remove unicode weirdness
        .replace(/[\u0300-\u036f]/g, "")   // accents
        .replace(/[^a-zA-Z0-9]/g, "")      // remove ALL special chars
        .toLowerCase()
        .trim();

    // ---------- SMART FINDER ----------
    function findValue(obj, possibleNames){
      const normalizedKeys = {};

      // normalize keys once
      Object.keys(obj).forEach(key=>{
        normalizedKeys[normalize(key)] = obj[key];
      });

      // search for match
      for(const name of possibleNames){
        const match = normalizedKeys[normalize(name)];
        if(match !== undefined && match !== "") return match;
      }
      return null;
    }

    // ---------- GET VALUES ----------
    
    const fullName = findValue(latest, [
      "full name",
      "fullname",
      "full_name",
      "staff name",
      "employee name",
      "name"
    ]);

    const employeeId = findValue(latest, [
      "employees id",
      "employee id",
      "employeeid",
      "staff id",
      "staffid",
      "id"
    ]);

    employeeData = {
      fullName: fullName || "Unknown",
      employeeId: employeeId || "Unknown"
    };

    console.log("Latest row:", latest);
    console.log("Resolved:", employeeData);

    faceStatusEl.textContent =
      `✅ Loaded Form data for ${employeeData.fullName} (${employeeData.employeeId})`;

  } catch(err) {
    console.error("Fetch error:", err);
    faceStatusEl.textContent =
      "⚠ Failed to fetch Form data. Enter ID manually.";
    employeeData = { fullName:"Unknown", employeeId:"" };
  }
}

// ----------------------
// Load authorized faces
async function loadAuthorizedFaces() {
  labeledDescriptors = [];
  const authorizedNames = ["John Doe", "Jane Smith", "Ikata Kenoye"];
  for (const name of authorizedNames) {
    try {
      const img = await faceapi.fetchImage(`https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/${name}.jpg`);
      const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks().withFaceDescriptor();
      if (detection) {
        labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(name, [detection.descriptor]));
      }
    } catch(err) { console.error(err); }
  }
  faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
}

// ----------------------
// Send attendance to Google Sheet
async function logToSheet(recognized, imageDataURL, coords) {
  const logData = {
    employeeId: employeeData.employeeId,
    fullName: employeeData.fullName,
    recognized: recognized ? "Authorized" : "Unauthorized",
    recognizeFaceImagelink: recognized ? imageDataURL : "",
    notRecognizeFaceImagelink: !recognized ? imageDataURL : "",
    latitude: coords.latitude,
    longitude: coords.longitude
  };

  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbyxUNToilDppXV15smR0ogBtUBFGI8B5HtM1I1yz59gnrQGCpU-KTkiwDErEUTES9oQXQ/exec", { 
      method: "POST",
      
      body: JSON.stringify(logData),
      
    });
    const result = await response.json();
    if(result.success){
      sheetStatusEl.style.color = "green";
      sheetStatusEl.textContent = "✅ Attendance sent";
    } else {
      sheetStatusEl.style.color = "red";
      sheetStatusEl.textContent = "❌ Error sending to sheet: " + result.error;
    }
  } catch(err) {
    sheetStatusEl.style.color = "red";
    sheetStatusEl.textContent = "❌ Error sending to sheet: " + err.message;
  }
}

// ----------------------
// Start camera & face detection
startBtn.onclick = async () => {
  startBtn.disabled = true;
  await loadAuthorizedFaces();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    await video.play();
    faceStatusEl.textContent = "🎥 Camera started — detecting faces...";

    setInterval(async () => {
      const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks().withFaceDescriptors();

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      faceapi.matchDimensions(canvas, { width: video.width, height: video.height });
      const resized = faceapi.resizeResults(detections, { width: video.width, height: video.height });

      for (let i = 0; i < resized.length; i++) {
        const result = faceMatcher.findBestMatch(resized[i].descriptor);
        const recognized = result.label !== "unknown";
        const statusText = recognized ? `Authorized: ${result.label}` : "Unauthorized";
        const timeNow = new Date().toLocaleTimeString();

        const box = resized[i].detection.box;
        new faceapi.draw.DrawBox(box, { label: `${statusText} | ${timeNow}` }).draw(canvas);
        faceStatusEl.textContent = `Face detected: ${statusText} | ${timeNow}`;

        const empId = employeeData.employeeId;
        if (!recognizedToday[empId]) recognizedToday[empId] = {};
        const today = new Date().toISOString().split("T")[0];

        if (!recognizedToday[empId][today]) {
          recognizedToday[empId][today] = true;

          // Capture image
          const captureCanvas = document.createElement("canvas");
          captureCanvas.width = video.videoWidth;
          captureCanvas.height = video.videoHeight;
          captureCanvas.getContext("2d").drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
          const imageDataURL = captureCanvas.toDataURL("image/jpeg");

          // Get location
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
              (pos) => logToSheet(recognized, imageDataURL, pos.coords),
              () => logToSheet(recognized, imageDataURL, {latitude:"", longitude:""})
            );
          } else {
            logToSheet(recognized, imageDataURL, {latitude:"", longitude:""});
          }
        }
      }
    }, 2000);

  } catch(err) {
    faceStatusEl.style.color = "red";
    faceStatusEl.textContent = "⚠️ Camera error: " + err.message;
    startBtn.disabled = false;
  }
};

window.addEventListener("load", loadModels);
</script>
</body>
</html>
