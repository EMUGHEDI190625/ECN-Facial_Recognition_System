<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECN Face Recognition System</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 10px;
      background: #f4f4f4;
    }
    video, canvas {
      border: 2px solid #000;
      border-radius: 8px;
      margin-top: 10px;
    }
    button {
      padding: 8px;
      font-size: 16px;
      margin: 5px;
    }
  </style>
</head>

<body>

<h2>ECN Face Recognition System</h2>

<button id="startBtn" disabled>Start Camera</button>
<p id="faceStatus">Loading models...</p>

<video id="video" width="320" height="240" autoplay muted></video>
<canvas id="overlay" width="320" height="240"></canvas>

<script>

const faceStatusEl = document.getElementById("faceStatus");
const startBtn = document.getElementById("startBtn");
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

let faceMatcher;
let labeledDescriptors = [];
let recognizedToday = {};
let employeeData = {};

// ===================== LOAD MODELS =====================
async function loadModels() {
  try {
    faceStatusEl.textContent = "Loading models...";

    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/'),
      faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/'),
      faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models/')
    ]);

    await loadAuthorizedFaces();
    await fetchLatestEmployee();

    faceStatusEl.textContent = "Ready ✔";
    startBtn.disabled = false;

  } catch (err) {
    console.error(err);
    faceStatusEl.textContent = "Model load failed";
    startBtn.disabled = false;
  }
}

// ===================== FETCH SHEET DATA =====================
async function fetchLatestEmployee() {
  try {
    const res = await fetch("YOUR_WEBAPP_URL_HERE");
    const data = await res.json();

    if (data.error) throw new Error(data.error);
    if (!Array.isArray(data)) throw new Error("Invalid response format");

    const latest = data.reverse()[0];

    employeeData = {
      fullName: latest?.["Full Name"] || latest?.["Name"] || "Unknown",
      employeeId: latest?.["Employee ID"] || latest?.["EmployeeId"] || "Unknown"
    };

    console.log("Employee Loaded:", employeeData);

  } catch (err) {
    console.error("Fetch error:", err);
    employeeData = { fullName: "Unknown", employeeId: "" };
  }
}

// ===================== LOAD FACES =====================
async function loadAuthorizedFaces() {
  labeledDescriptors = [];

  const users = ["EMP001", "EMP002", "ECN21"];

  for (const id of users) {
    try {
      const img = await faceapi.fetchImage(
        `https://raw.githubusercontent.com/EMUGHEDI190625/face-models/main/images/${id}.jpg`
      );

      const detection = await faceapi
        .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (detection) {
        labeledDescriptors.push(
          new faceapi.LabeledFaceDescriptors(id, [detection.descriptor])
        );
      }

    } catch (err) {
      console.error("Face load error:", err);
    }
  }

  faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
}

// ===================== START CAMERA =====================
startBtn.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    await video.play();

    faceStatusEl.textContent = "Camera running...";

    setInterval(async () => {

      const detections = await faceapi
        .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptors();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const resized = faceapi.resizeResults(detections, {
        width: video.width,
        height: video.height
      });

      for (const det of resized) {

        const match = faceMatcher.findBestMatch(det.descriptor);

        const empId = match.label;
        const distance = match.distance;

        // 🔥 FILTER INVALID FACE
        if (empId === "unknown" || distance > 0.55) continue;

        if (recognizedToday[empId]) continue;
        recognizedToday[empId] = true;

        console.log("Recognized:", empId);

        const url =
          "YOUR_WEBAPP_URL_HERE?employeeId=" +
          encodeURIComponent(empId);

        try {
          const res = await fetch(url);
          const data = await res.json();
          console.log("Sheet result:", data);

        } catch (err) {
          console.error("Sheet fetch error:", err);
        }

        break;
      }

    }, 2000);

  } catch (err) {
    console.error(err);
    faceStatusEl.textContent = "Camera error";
    startBtn.disabled = false;
  }
};

// ===================== INIT =====================
window.addEventListener("load", loadModels);

</script>

</body>
</html>
